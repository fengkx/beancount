<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pyodide Beancount POC</title>
    <style>
      :root {
        color-scheme: light;
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }
      body {
        margin: 24px;
        max-width: 920px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 12px 0;
      }
      #status {
        padding: 8px 10px;
        border: 1px solid #ccc;
        background: #f7f7f7;
        margin-bottom: 12px;
        white-space: pre-wrap;
      }
      textarea {
        width: 100%;
        height: 220px;
        font-size: 13px;
        padding: 8px;
        box-sizing: border-box;
      }
      button {
        margin-top: 8px;
        padding: 8px 12px;
        font-size: 13px;
      }
      pre {
        background: #111;
        color: #e6e6e6;
        padding: 12px;
        overflow: auto;
        max-height: 320px;
      }
    </style>
  </head>
  <body>
    <h1>Pyodide Beancount POC</h1>
    <div id="status">Idle</div>
    <textarea id="input">2024-01-01 open Assets:Cash USD
2024-01-01 open Equity:Opening-Balances USD

2024-01-02 * "Init"
  Assets:Cash  10 USD
  Equity:Opening-Balances
</textarea>
    <div>
      <button id="run">Init and Run</button>
    </div>
    <pre id="output"></pre>

    <script type="module" src="./main.js"></script>
  </body>
</html>
